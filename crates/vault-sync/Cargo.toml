[package]
name = "vault-sync"
description = "End-to-end encrypted vault sync: the transport and the pull→merge→push engine, independent of any UI or platform."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# The merge itself lives in vault-core; this crate only decides when to run it.
vault-core.workspace = true
# Drive's REST API and the OAuth token endpoint both speak JSON.
serde_json.workspace = true
reqwest.workspace = true
# PKCE: SHA-256 for the code challenge, getrandom for the verifier,
# base64url for both.
sha2.workspace = true
getrandom.workspace = true
data-encoding.workspace = true
# Tokens are wiped when they go out of scope; they are never written to disk.
zeroize.workspace = true

[lints.rust]
unsafe_code = "forbid"
