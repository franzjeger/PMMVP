name: CI

# Cross-platform verification for the Arca workspace.
#
# `test` builds and runs the full suite on Linux, Windows, and macOS — this is
# what closes the "compiles/runs on the target platform" gap, including the
# Tauri desktop crate's deterministic clipboard + command tests.
#
# `test-cross` also carries the ONLY compilation the Swift ever gets. It is
# written on Linux, where SwiftUI, AuthenticationServices, LocalAuthentication
# and Security do not exist, so the macOS runner is the first and only compiler
# it meets. Unsigned; running the extensions needs an Apple ID.
#
# `linux-smoke` runs the #[ignore]d real-OS smoke tests on an actual X11 session
# (Xvfb) and D-Bus + gnome-keyring, so the arboard clipboard code path executes
# on Linux — the platform the clipboard fix targets, which the in-memory tests
# can't model.
#
# `linux-package` builds the .deb/.rpm and asserts they actually contain the
# native-messaging host plus its browser manifests. Nothing else in CI runs
# `tauri build`, which is exactly how the bundles once shipped the desktop app
# alone: the app worked, but the extension had nothing to talk to and reported
# "Can't reach Arca". A green `test` job cannot catch that, because the failure
# is in what gets packaged rather than in what compiles.
#
# NOTE: CI cannot cover interactive cross-application paste on Wayland (there is
# no Wayland compositor on the runners). That single check remains a manual,
# one-time run on a real X11 *and* Wayland desktop before shipping to Linux
# users — see SECURITY.md.

# Minute economics (free tier = 2000 min/month; macOS bills at 10x, Windows at
# 2x): plain pushes run ONE Linux job. The cross-platform matrix and the Linux
# smoke job run on pull requests or on demand (workflow_dispatch) — day-to-day
# macOS/Windows verification happens on the real machines before every deploy.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: build & test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            libdbus-1-dev build-essential file \
            libxcb1 libxcb-render0 libxcb-shape0 libxcb-xfixes0

      # Toolchain and components come from rust-toolchain.toml, so Rust is
      # bumped in exactly one place. rustup ships on the runners and honours
      # that file over its own default; `rustup show` materialises it up front
      # so a download failure reads as itself rather than as a cargo error.
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build frontend (tsc type-check + Vite bundle)
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - name: Frontend component tests
        working-directory: apps/desktop
        run: npm run test

      # The extension's passkey path, run against the real content-script files.
      # Both bugs it covers — the gate refusing a ceremony that starts on a
      # freshly navigated page, and handing the relying party an object that is
      # not a real PublicKeyCredential — shipped once and were invisible from
      # inside the extension: Arca reported success either way. No dependencies,
      # so it needs nothing beyond the Node installed above.
      - name: Extension passkey tests
        run: node extension/test/passkey.test.mjs

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test (all crates)
        run: cargo test --workspace

  test-cross:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 2x/10x billing: only on PR or manual dispatch, never plain pushes.
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            libdbus-1-dev build-essential file \
            libxcb1 libxcb-render0 libxcb-shape0 libxcb-xfixes0

      # Toolchain and components come from rust-toolchain.toml, so Rust is
      # bumped in exactly one place. rustup ships on the runners and honours
      # that file over its own default; `rustup show` materialises it up front
      # so a download failure reads as itself rather than as a cargo error.
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build frontend (tsc type-check + Vite bundle)
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - name: Frontend component tests
        working-directory: apps/desktop
        run: npm run test

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test (all crates)
        run: cargo test --workspace

      # apps/ios links vault-ffi cross-compiled for the phone. Cheap on its own
      # (vault-ffi pulls in only vault-core, not Tauri), and separate from the
      # Swift build below so a Rust cross-compile break reads as one rather than
      # as a mysterious Xcode failure.
      - name: vault-ffi cross-compiles for iOS
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          for t in aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios; do
            cargo build -p vault-ffi --release --target "$t"
          done

      # The Swift in apps/ is written and reviewed on Linux, where no toolchain
      # can build it: SwiftUI, AuthenticationServices, LocalAuthentication and
      # Security do not exist there. This runner is the only machine in CI with
      # Xcode, so it is the only place the ~1200 lines across apps/macos,
      # apps/ios and apps/apple-shared get compiled at all. It rides the macOS
      # matrix leg already being paid for rather than adding a job.
      #
      # Compile only. Running either extension needs provisioning, which needs
      # an Apple ID; CODE_SIGNING_ALLOWED=NO gets the compiler and the linker
      # without one. The iOS scheme also exercises scripts/build-ffi-ios.sh,
      # so the cross-compile and staging are covered by the same step.
      #
      # The script reports a diagnostic COUNT rather than relying on an empty
      # log, because an empty log cannot distinguish "clean" from "suppressed".
      # That number is also what decides whether SWIFT_VERSION can go to 6.0:
      # SWIFT_STRICT_CONCURRENCY is `complete` in both projects, so its findings
      # are warnings today and errors under the Swift 6 language mode.
      - name: Build the Swift targets, unsigned (macOS + iOS)
        if: runner.os == 'macOS'
        run: |
          brew install xcodegen
          scripts/build-apple-ci.sh

  linux-smoke:
    name: linux real-clipboard & keychain smoke
    runs-on: ubuntu-latest
    # Heavier job (X11/Wayland/keyring setup): PR or manual dispatch only.
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            libdbus-1-dev build-essential file \
            libxcb1 libxcb-render0 libxcb-shape0 libxcb-xfixes0 \
            xvfb dbus-x11 gnome-keyring libsecret-1-0 sway

      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build frontend
        working-directory: apps/desktop
        run: npm ci && npm run build

      # Exercises clipboard::tests::real_clipboard_round_trips against the real
      # X11 clipboard provided by Xvfb (the matrix job only runs the in-memory
      # fake). This is the bulk of the Linux clipboard verification.
      - name: Real clipboard smoke (X11 via Xvfb)
        run: xvfb-run --auto-servernum cargo test -p vault-desktop -- --ignored real_clipboard

      # Exercises the SAME smoke against a real Wayland compositor (headless
      # sway, a wlroots compositor that implements wlr-data-control, which
      # arboard's Wayland backend uses). Best-effort: headless Wayland in CI is
      # environment-sensitive, and it still cannot model an interactive
      # cross-application paste (that stays a manual acceptance test). A failure
      # here is informational, not a gate. See THREAT_MODEL.md.
      - name: Real clipboard smoke (Wayland via headless sway)
        continue-on-error: true
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          export WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1
          printf 'exec sleep infinity\n' > "$XDG_RUNTIME_DIR/sway.cfg"
          sway -c "$XDG_RUNTIME_DIR/sway.cfg" >/dev/null 2>&1 &
          sleep 6
          export WAYLAND_DISPLAY=wayland-1
          cargo test -p vault-desktop -- --ignored real_clipboard

      # Exercises vault-store's keychain quick-unlock against a real Secret
      # Service (gnome-keyring on the session bus). Best-effort: CI keyring
      # setup is environment-sensitive, so a failure here is informational, not
      # a gate.
      - name: Keychain smoke (Secret Service via gnome-keyring)
        continue-on-error: true
        run: |
          dbus-run-session -- bash -c '
            eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
            cargo test -p vault-store -- --ignored quick_unlock_round_trip
          '

  linux-package:
    name: linux .deb/.rpm ship the native host
    runs-on: ubuntu-latest
    # A full release bundle is expensive, so it follows the same minute
    # economics as the other heavy jobs: PR or manual dispatch, never a push.
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            libdbus-1-dev build-essential file \
            libxcb1 libxcb-render0 libxcb-shape0 libxcb-xfixes0 \
            rpm

      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build the Linux bundles
        working-directory: apps/desktop
        run: |
          npm ci
          npm run tauri build -- --bundles deb,rpm

      # The point of the job. Every assertion below corresponds to something a
      # user hits directly: a missing binary or manifest means autofill fails
      # with an error that blames their setup rather than the package.
      - name: Assert the bundles contain the host and its manifests
        run: |
          set -euo pipefail
          DEB="$(find target/release/bundle/deb -name '*.deb' | head -1)"
          RPM="$(find target/release/bundle/rpm -name '*.rpm' | head -1)"
          echo "deb: $DEB"
          echo "rpm: $RPM"

          root=$(mktemp -d)
          dpkg-deb -x "$DEB" "$root"

          MANIFESTS="
            etc/opt/chrome/native-messaging-hosts/no.sybr.vault.json
            etc/chromium/native-messaging-hosts/no.sybr.vault.json
            usr/lib/mozilla/native-messaging-hosts/no.sybr.vault.json
          "
          for f in usr/bin/vault-native-host $MANIFESTS; do
            [ -e "$root/$f" ] || { echo "MISSING from .deb: /$f"; exit 1; }
            echo "ok: /$f"
          done
          [ -x "$root/usr/bin/vault-native-host" ] \
            || { echo "/usr/bin/vault-native-host is not executable"; exit 1; }

          # Every manifest must point at the packaged path, not at a build dir.
          # A manifest pointing into target/ is the failure mode that survives a
          # dev checkout and breaks on a real install.
          for f in $MANIFESTS; do
            node -e '
              const m = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              if (m.path !== "/usr/bin/vault-native-host") {
                console.error(`${process.argv[1]}: path is ${m.path}`);
                process.exit(1);
              }
            ' "$root/$f"
          done
          echo "ok: all manifests point at /usr/bin/vault-native-host"

          # Cross-check the pinned extension id against an independent
          # derivation (this shell pipeline vs the JS in
          # scripts/gen-linux-packaging.mjs). If the two ever disagree, the
          # packaged manifest would silently reject the real extension.
          KEY="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("extension/chromium/manifest.json","utf8")).key||"")')"
          [ -n "$KEY" ] || { echo 'no "key" in extension/chromium/manifest.json'; exit 1; }
          HEX="$(printf '%s' "$KEY" | base64 -d | openssl dgst -sha256 | awk '{print $NF}')"
          EXT_ID="$(printf '%s' "${HEX:0:32}" | tr '0-9a-f' 'a-p')"
          grep -q "chrome-extension://$EXT_ID/" \
            "$root/etc/opt/chrome/native-messaging-hosts/no.sybr.vault.json" \
            || { echo "chromium manifest does not allow $EXT_ID"; exit 1; }
          echo "ok: chromium manifest allows the pinned id $EXT_ID"

          # Prove the packaged binary is a working native host, not just a file
          # of the right name. No desktop app runs here, so the handshake
          # reports app_connected:false — the response itself is the assertion.
          reply="$(printf '\x10\x00\x00\x00{"type":"hello"}' \
            | "$root/usr/bin/vault-native-host" | tail -c +5)"
          echo "handshake: $reply"
          case "$reply" in
            *'"name":"no.sybr.vault"'*) echo "ok: packaged host answers the native-messaging handshake" ;;
            *) echo "packaged host did not answer a valid hello"; exit 1 ;;
          esac

          # The .rpm is generated from the same `files` map and drifts silently
          # if only one of the two is updated. List it once and check the
          # listing is non-empty first, so a broken `rpm` reads as itself rather
          # than as every file being absent.
          RPM_FILES="$(rpm -qpl "$RPM")"
          [ -n "$RPM_FILES" ] || { echo "could not list contents of $RPM"; exit 1; }
          for f in usr/bin/vault-native-host $MANIFESTS; do
            printf '%s\n' "$RPM_FILES" | grep -qx "/$f" \
              || { echo "MISSING from .rpm: /$f"; exit 1; }
          done
          echo "ok: .rpm carries the same payload"
